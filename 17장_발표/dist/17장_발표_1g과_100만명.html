  <head>

      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>17장 김서혁</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&display=swap"
    />
    <style>
/* 색과 글꼴. 흰 배경, 먹색, 강조색 하나, 글꼴 하나. */
:root {
  color-scheme: light;
  --paper: #fff;
  --ink: #111;
  --gray: #6b6b6b;
  --line: #dcdcdc;
  --tint: #f3f3f3;     /* 차트 음영 */
  --accent: #c4521d;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
</style>
    <style>
/* 슬라이드 틀: 1600×900 무대, 아래쪽 표시줄, 내비, 기본 글자 */
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font); overflow: hidden;
  word-break: keep-all; overflow-wrap: break-word; /* 한글이 단어 중간에서 끊기지 않게 */
}
/* 끌어서 넘길 때 브라우저의 스크롤, 뒤로 가기, 글자 선택이 끼어들지 않게 한다 */
html, body { overscroll-behavior: none; }
#viewport { position: fixed; inset: 0; touch-action: none; user-select: none; }
/* 크기와 상관없이 항상 화면 정중앙. 배율은 deck.js의 fit()이 정한다. */
#stage:not(.ready) { visibility: hidden; } /* 글꼴을 받을 때까지 숨긴다 (deck.js) */
#stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%); }

.slide {
  position: absolute; inset: 0; box-sizing: border-box; padding: 80px 100px 90px;
  display: none; flex-direction: column; gap: 40px; overflow: hidden;
}
.slide.on { display: flex; }

/* 왼쪽: 구역 · 출처 쪽수, 오른쪽: 쪽 번호 */
.foot { position: absolute; left: 100px; right: 100px; bottom: 36px; display: flex; justify-content: space-between; font-size: 18px; color: var(--gray); font-variant-numeric: tabular-nums; }

h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
h1 { font-size: 96px; line-height: 1.2; }
h2 { font-size: 52px; line-height: 1.25; }
h3 { font-size: 30px; line-height: 1.35; }
p, li { margin: 0; font-size: 30px; line-height: 1.5; }
b { font-weight: 600; }
.accent { color: var(--accent); }

/* 내비: 마우스를 올릴 때만 보인다 */
#nav { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 4px; align-items: center; opacity: 0; }
#nav:hover, #nav:focus-within { opacity: 1; }
#nav button { font: 16px var(--font); color: var(--ink); background: var(--paper); border: 1px solid var(--line); padding: 8px 12px; cursor: pointer; }
#nav .cnt { font-size: 16px; color: var(--gray); padding: 0 8px; font-variant-numeric: tabular-nums; }

.load-error { padding: 80px; font-size: 28px; line-height: 1.6; color: var(--accent); }
</style>
    <style>
/* 슬라이드 부품. js/ui.js의 함수와 짝을 이룬다. */
.small { font-size: 22px; color: var(--gray); }
.statement { margin-top: auto; margin-bottom: 72px; font-size: 36px; line-height: 1.4; font-weight: 600; }

/* 칸 나누기 */
.cols { display: grid; gap: 64px; }
.cols.n2 { grid-template-columns: 1fr 1fr; }
.cols.n3 { grid-template-columns: repeat(3, 1fr); gap: 48px; }
.col { display: flex; flex-direction: column; gap: 14px; }
.col .label { font-size: 22px; color: var(--gray); }
.col h3 { font-size: 36px; }
.col p, .col li { font-size: 30px; }
/* 제목 아래 남는 공간의 세로 가운데에 놓는다 */
.slide > .cols, .slide > table { margin-block: auto; }
/* 칸 맨 위의 회색 작은 글씨가 약해 아래로 쏠려 보이므로 위로 보정한다. 값의 절반만큼 올라간다. */
.slide > .cols { padding-bottom: 100px; }

ul.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 20px; }

/* 표 */
table.t { width: 100%; border-collapse: collapse; font-size: 26px; line-height: 1.4; }
table.t th { padding: 0 24px 14px 0; border-bottom: 1px solid var(--ink); text-align: left; font-size: 20px; font-weight: 400; color: var(--gray); }
table.t td { padding: 20px 24px 20px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t.compact { font-size: 21px; }

/* 질문 번호와 질문 문장 (시뮬레이션 없는 질문 슬라이드에서도 쓴다) */
.q-label { font-size: 44px; line-height: 1.2; font-weight: 600; color: var(--accent); }
.q { font-size: 44px; line-height: 1.4; font-weight: 600; text-wrap: balance; }

/* 표지 · 큰 문장 */
.cover { justify-content: center; gap: 48px; }
.headline { font-size: 80px; margin-bottom: 60px; }
.cover h1 { font-size: 80px; }
.presenter { font-size: 34px; }
.center { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
.thanks { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 600; }

/* 추정치 사다리: 가운데 축에서 선을 뽑아 설명을 단다. --row가 설명 한 줄의 높이. */
.ladder { --label-w: 170px; --row: 92px; --ticks: 40px; flex: 1; display: grid; grid-template-columns: var(--label-w) 1fr; align-content: center; align-items: center; }
.lab { font-size: 28px; font-weight: 600; }
.zone { position: relative; }
.zone.up { height: calc(var(--max) * var(--row)); }
.zone.dn { height: calc(var(--ticks) + var(--max) * var(--row)); }
.axis { position: relative; height: 1px; background: var(--ink); }
.axis .dot { position: absolute; top: -7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--accent); z-index: 1; }
.range-bar { position: absolute; top: -2px; height: 5px; background: var(--accent); opacity: .35; }
.stem { position: absolute; width: 0; border-left: 1px solid var(--gray); }
.up .stem { bottom: 0; height: calc(var(--lv) * var(--row)); }
.dn .stem { top: 0; height: calc(var(--ticks) + var(--lv) * var(--row)); }
.tx { position: absolute; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; background: var(--paper); }
.tx b { font-size: 28px; line-height: 1.25; }
.tx span { font-size: 20px; line-height: 1.35; color: var(--gray); }
.up .tx { top: 0; left: 12px; }
.dn .tx { bottom: 0; right: 12px; text-align: right; } /* 오른쪽 끝이라 글자를 선 왼쪽에 둔다 */
.ticks { position: absolute; inset: 0 0 auto 0; height: var(--ticks); }
.ticks span { position: absolute; top: 10px; padding: 0 4px; transform: translateX(-50%); font-size: 18px; color: var(--gray); white-space: nowrap; background: var(--paper); z-index: 1; }




/* 시뮬레이션 슬라이드 */
.sim-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: 500px 1fr; gap: 64px; }
.sim-text { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.sim-text h2 { font-size: 44px; }
.sim-text p, .sim-text li { font-size: 26px; }
.sim-text .small { font-size: 20px; }
.sim-text .q { font-size: 36px; }
.sim-text .formula { font-size: 28px; }
.sim-text .small:last-child { margin-top: auto; }
.params { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 18px; font-size: 22px; line-height: 1.4; }
.params dt { font-weight: 600; }
.params dd { margin: 0; color: var(--gray); }

.sim { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
.sim canvas { display: block; width: 100%; flex: 1; min-height: 0; }
.ctl { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px 40px; }
.ctl.one { grid-template-columns: 1fr; }
.sim label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 20px; color: var(--gray); }
.sim label output { color: var(--ink); font-variant-numeric: tabular-nums; }
.sim input[type=range] { width: 100%; height: 26px; margin: 0; accent-color: var(--accent); }
.sim .small { font-size: 18px; }
/* 아래 설명 + 발표 단계 표시 (지금 단계가 진한 점) */
.sim-foot { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
.dots { display: flex; gap: 8px; flex-shrink: 0; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--gray); }

.readout { display: flex; align-items: baseline; gap: 40px; }
.ro .k { display: block; font-size: 18px; color: var(--gray); }
.ro .v { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; }
.status { margin-left: auto; font-size: 26px; font-weight: 600; }
.status.down { color: var(--accent); }

/* 슬라이드 오른쪽 위의 논문 이미지 (참고용으로 작게) */
.paper { position: absolute; top: 80px; right: 100px; width: 250px; border: 1px solid var(--line); }
.with-paper > .cols, .with-paper > .statement, .with-paper > .small { margin-right: 300px; }
.with-paper > .cols { padding-bottom: 0; row-gap: 40px; }
</style>

    <div id="viewport"><div id="stage"></div></div>

    <nav id="nav" aria-label="슬라이드 이동">
      <button type="button" id="prev" aria-label="이전 슬라이드">←</button>
      <span class="cnt" id="cnt"></span>
      <button type="button" id="next" aria-label="다음 슬라이드">→</button>
      <button type="button" id="fs">전체 화면</button>

    <script>
/* 슬라이드 부품: content/slides.js에서 쓰는 함수들. 전부 HTML 문자열을 돌려준다.
   모양은 css/components.css에서 고친다. */
window.UI = (() => {
  const join = (items) => [items].flat().filter(Boolean).join('');

  const p = (text) => `<p>${text}</p>`;
  const small = (text) => `<p class="small">${text}</p>`;
  const statement = (text) => `<p class="statement">${text}</p>`; // 슬라이드 아래쪽 결론 한 문장
  const list = (items) => `<ul class="plain">${items.map((t) => `<li>${t}</li>`).join('')}</ul>`;

  /* col({ label, title, text }) — 항목은 모두 선택, text는 글 또는 글 목록 */
  const col = ({ label, title, text }) => `<div class="col">
    ${label ? `<span class="label">${label}</span>` : ''}${title ? `<h3>${title}</h3>` : ''}
    ${[text].flat().filter(Boolean).map((t) => (t.startsWith('<') ? t : p(t))).join('')}</div>`;
  const cols = (n, items) => `<div class="cols n${n}">${join(items)}</div>`;
  const center = (items) => `<div class="center">${join(items)}</div>`; // 세로 가운데 정렬

  /* table({ head: [['제목', '너비']...], rows: [[칸...]...], compact }) */
  const table = ({ head, rows, compact }) => `<table class="t${compact ? ' compact' : ''}"><thead><tr>${head.map(([label, w]) => `<th${w ? ` style="width:${w}"` : ''}>${label}</th>`).join('')}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

  /* ladder: 가운데 로그 축에서 선을 뽑아 끝에 설명을 단다. 값만 적으면 위치는 자동.
     up: 축 위쪽 묶음, dn: 축 아래쪽 묶음. { label, markers }
     표식 { at, range: [낮은값, 높은값], v: 큰 글자, w: 설명, level: 선 길이(1, 2, 3...) }
     선이 글자를 가로지르지 않게: 위쪽은 왼쪽 점일수록, 아래쪽은 오른쪽 점일수록 level을 크게 준다. */
  const ladder = ({ min, max, ticks, up, dn }) => {
    const pos = (x) => ((Math.log10(x) - Math.log10(min)) / (Math.log10(max) - Math.log10(min))) * 100;
    const pct = (x) => pos(x).toFixed(2) + '%';
    const stem = (m) => `<div class="stem" style="left:${pct(m.at)};--lv:${m.level}"><div class="tx"><b>${m.v}</b><span>${m.w}</span></div></div>`;
    const dot = (m) => `${m.range ? `<i class="range-bar" style="left:${pct(m.range[0])};width:${(pos(m.range[1]) - pos(m.range[0])).toFixed(2)}%"></i>` : ''}<i class="dot" style="left:${pct(m.at)}"></i>`;
    const all = [...up.markers, ...dn.markers];
    const levels = (g) => Math.max(...g.markers.map((m) => m.level));
    return `<div class="ladder">
      <div class="lab">${up.label}</div><div class="zone up" style="--max:${levels(up)}">${up.markers.map(stem).join('')}</div>
      <div></div><div class="axis">${all.map(dot).join('')}</div>
      <div class="lab">${dn.label}</div><div class="zone dn" style="--max:${levels(dn)}">
        <div class="ticks">${ticks.map(([x, name]) => `<span style="left:${pct(x)}">${name}</span>`).join('')}</div>
        ${dn.markers.map(stem).join('')}</div>
    </div>`;
  };

  /* 왼쪽 글 + 오른쪽 시뮬레이션. simId는 content/sims.js의 이름 */
  const simSlide = (simId, text) => `<div class="sim-wrap"><div class="sim-text">${join(text)}</div>${Sims.markup(simId)}</div>`;
  const question = (text) => `<p class="q">${text}</p>`;
  const questionLabel = (text) => `<p class="q-label">${text}</p>`;
  /* 매개변수 설명: params([['α', '설명'], ...]) */
  const params = (items) => `<dl class="params">${items.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;

  return { p, small, statement, params, list, col, cols, center, table, ladder, simSlide, question, questionLabel };
})();
</script>
    <script>
/* 헨릭(2004) 전수 모델과 숫자 표기.
   가장 숙련된 사람의 수준 b를 추적한다.
   N명의 학습자가 각각 (스승 − α + Gumbel(0, β))를 얻으면,
   그중 최댓값은 정확히 스승 − α + β·ln N + Gumbel(0, β)를 따른다.
   따라서 기대 변화는 Δz = −α + β(γ + ln N)로 논문 식 (2)와 같다. */
window.Model = (() => {
  const GAMMA = 0.5772156649;

  /* mulberry32: 같은 설정이면 같은 그림이 나오도록 시드를 고정한다 */
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const gumbel = (r, beta) => -beta * Math.log(-Math.log(Math.max(r(), 1e-12)));

  const nStar = (alpha, beta = 1) => Math.exp(alpha / beta - GAMMA);
  const deltaZ = (alpha, n, beta = 1) => -alpha + beta * (GAMMA + Math.log(n));

  /* 한 번의 시행. pop(t): t세대에 배우는 사람 수.
     숙련도가 0이 되면 그 기술을 아는 사람이 없으므로 그 뒤로는 0에 머문다(가정). */
  function run({ gens, pop, alpha, beta = 1, start = 10, seed = 1 }) {
    const r = rng(seed);
    const out = [start];
    let b = start;
    for (let t = 0; t < gens; t++) {
      if (b > 0) b = Math.max(0, b - alpha + beta * Math.log(pop(t)) + gumbel(r, beta));
      out.push(b);
    }
    return out;
  }

  /* 시드를 하나씩 바꿔 여러 번 돌린다 */
  const runMany = (count, firstSeed, opts) => Array.from({ length: count }, (_, k) => run({ ...opts, seed: firstSeed + k }));

  /* ---------- 숫자 표기 ---------- */
  const group = (n) => n.toLocaleString('ko-KR');

  return { nStar, deltaZ, run, runMany, group };
})();
</script>
    <script>
/* 캔버스 선 그래프. 옅은 시행은 회색, 대표선은 강조색. */
window.Chart = (() => {
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const DPR = 2;
  const PAD = { left: 76, right: 12, top: 12, bottom: 56 };

  /* 축 최댓값을 보기 좋은 수로 올린다 */
  function niceMax(v) {
    if (v <= 0) return 10;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p;
    return 10 * p;
  }

  /* o: { xMin, xMax, yMin, yMax, log, xTicks, yTicks, yFmt, xLabel, yLabel,
          bands: [{from,to,label}], hlines: [{y,label,align}],
          faint: [[y...]...] 세대별 시행들, others: 비교용 선, xFmt: x 눈금 글자, main: [[x,y]...] 대표선, dot: {x,y} } */
  function draw(canvas, o) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    canvas.width = w * DPR; canvas.height = h * DPR;
    const g = canvas.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.clearRect(0, 0, w, h);

    const ink = css('--ink'), gray = css('--gray'), line = css('--line'), accent = css('--accent');
    const font = '17px ' + css('--font');
    const { left: L, right: R, top: T, bottom: B } = PAD;
    const pw = w - L - R, ph = h - T - B;

    const xMin = o.xMin ?? 0, yMin = o.yMin ?? 0;
    const X = (x) => L + ((x - xMin) / (o.xMax - xMin)) * pw;
    const Y = o.log
      ? (y) => T + ph - ((Math.log10(Math.max(y, yMin)) - Math.log10(yMin)) / (Math.log10(o.yMax) - Math.log10(yMin))) * ph
      : (y) => T + ph - ((y - yMin) / (o.yMax - yMin)) * ph;
    const path = (pts, color, width, alpha = 1) => {
      g.strokeStyle = color; g.globalAlpha = alpha; g.lineWidth = width; g.lineJoin = 'round';
      g.beginPath();
      pts.forEach(([x, y], i) => { const yy = Y(Math.min(y, o.yMax)); i ? g.lineTo(X(x), yy) : g.moveTo(X(x), yy); });
      g.stroke(); g.globalAlpha = 1;
    };

    g.font = font;
    // 음영 구간
    (o.bands || []).forEach((bd) => {
      g.fillStyle = css('--tint');
      g.fillRect(X(bd.from), T, X(bd.to) - X(bd.from), ph);
      if (bd.label) { g.fillStyle = gray; g.textAlign = 'left'; g.textBaseline = 'top'; g.fillText(bd.label, X(bd.from) + 8, T + 8); }
    });

    // 눈금
    g.lineWidth = 1;
    o.yTicks.forEach((v) => {
      const y = Y(v);
      g.strokeStyle = line; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
      g.fillStyle = gray; g.textAlign = 'right'; g.textBaseline = 'middle';
      g.fillText(o.yFmt ? o.yFmt(v) : v, L - 10, y);
    });
    g.textBaseline = 'top'; g.textAlign = 'center';
    o.xTicks.forEach((v) => {
      const label = String(o.xFmt ? o.xFmt(v) : v);
      const half = g.measureText(label).width / 2;
      g.fillText(label, Math.min(X(v), w - half), T + ph + 8); // 오른쪽 끝 글자가 잘리지 않게
    });
    g.textAlign = 'right'; g.fillText(o.xLabel, L + pw, T + ph + 32);
    g.textAlign = 'left'; g.fillText(o.yLabel, L, T + ph + 32);

    // 기준선
    (o.hlines || []).forEach((hl) => {
      const y = Y(hl.y);
      g.setLineDash([4, 5]); g.strokeStyle = gray; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke(); g.setLineDash([]);
      g.fillStyle = ink; g.textAlign = hl.align || 'right'; g.textBaseline = 'bottom';
      g.fillText(hl.label, hl.align === 'left' ? L + 8 : L + pw - 4, y - 4);
    });

    // 비교용 회색 선: [{ pts: [[x,y]...], label }] 왼쪽 시작점 위에 이름을 단다 (오른쪽은 기준선 이름 자리)

      path(ln.pts, gray, 1.2, 0.45);
      const [x, y] = ln.pts[0];
      if (ln.label) { g.fillStyle = gray; g.textAlign = 'left'; g.textBaseline = 'bottom'; g.fillText(ln.label, X(x) + 6, Y(y) - 4); }
    });
    (o.faint || []).forEach((r) => path(r.map((y, t) => [t, y]), gray, 1.2, 0.3));

    if (o.dot) {
      g.fillStyle = accent;

    <script>
/* 시뮬레이션 틀. content/sims.js에 적은 설정으로 계기판과 슬라이더를 만들고 연결한다.
   Sims.define('이름', {
     controls: [{ key, label, min, max, step, value, read: 슬라이더값→실제값, show: 실제값→표시 글자 }],
     readouts: [{ key, label }],
     status: true,        // 상태 글자 표시 여부
     note: '아래 설명',
     steps: [{ key: 슬라이더값 }, ...],  // 발표 단계. '다음'을 누르면 차례로 이 값으로 움직인다
     render(values, ui),  // ui.set(key, 글자), ui.status(글자, 나쁜상태여부), ui.chart(옵션)
   }); */
window.Sims = (() => {
  const defs = {};
  const ANIM_MS = 600;

  const define = (id, def) => { defs[id] = def; };

  function markup(id) {
    const d = defs[id];
    if (!d) throw new Error('content/sims.js에 없는 시뮬레이션: ' + id);
    const readouts = d.readouts.map((r) => `<div class="ro"><span class="k">${r.label}</span><span class="v" data-o="${r.key}">–</span></div>`).join('');
    const controls = d.controls.map((c) => {
      const inputId = `${id}-${c.key}`;
      return `<div><label for="${inputId}">${c.label} <output data-c="${c.key}"></output></label>
        <input id="${inputId}" data-k="${c.key}" type="range" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"></div>`;
    }).join('');
    const dots = d.steps ? `<span class="dots">${d.steps.map(() => '<i></i>').join('')}</span>` : '';
    return `<div class="sim" data-sim="${id}">
      <div class="readout">${readouts}${d.status ? '<span class="status" data-status></span>' : ''}</div>
      <canvas></canvas>
      <div class="ctl${d.controls.length === 1 ? ' one' : ''}">${controls}</div>
      <div class="sim-foot">${d.note ? `<p class="small">${d.note}</p>` : '<span></span>'}${dots}</div>
    </div>`;
  }

  function render(root) {
    const d = defs[root.dataset.sim];
    const values = {};
    d.controls.forEach((c) => {
      const raw = +root.querySelector(`[data-k="${c.key}"]`).value;
      values[c.key] = c.read ? c.read(raw) : raw;
      root.querySelector(`[data-c="${c.key}"]`).textContent = c.show(values[c.key]);
    });
    d.render(values, {
      set: (key, text) => { root.querySelector(`[data-o="${key}"]`).textContent = text; },
      status: (text, bad) => { const s = root.querySelector('[data-status]'); s.className = 'status' + (bad ? ' down' : ''); s.textContent = text; },
      chart: (opts) => Chart.draw(root.querySelector('canvas'), opts),
    });
  }

  /* ---------- 발표 단계 ---------- */
  const input = (root, key) => root.querySelector(`[data-k="${key}"]`);
  const stepRoot = (slide) => [...slide.querySelectorAll('[data-sim]')].find((r) => defs[r.dataset.sim].steps);

  function markStep(root, i) {
    root.dataset.step = i;
    root.querySelectorAll('.dots i').forEach((dot, j) => dot.classList.toggle('on', j === i));
  }

  function stopAnim(root) {
    cancelAnimationFrame(root._anim);
    clearTimeout(root._finish);
  }

  function setValues(root, target) {
    stopAnim(root);
    Object.entries(target).forEach(([k, v]) => { input(root, k).value = v; });
    render(root);
  }

  /* 지금 값에서 목표 값으로 슬라이더를 부드럽게 움직인다 */
  function animateTo(root, target) {
    stopAnim(root);
    const from = Object.fromEntries(Object.keys(target).map((k) => [k, +input(root, k).value]));
    let t0 = null; // 첫 프레임의 시각을 기준으로 삼는다
    const frame = (now) => {
      if (t0 === null) t0 = now;
      const t = Math.max(0, Math.min(1, (now - t0) / ANIM_MS));
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // 천천히 출발해 천천히 멈춘다
      Object.entries(target).forEach(([k, v]) => { input(root, k).value = from[k] + (v - from[k]) * e; });
      render(root);
      if (t < 1) root._anim = requestAnimationFrame(frame);
      else setValues(root, target);
    };
    root._anim = requestAnimationFrame(frame);
    // 화면 갱신이 멈춰도(창이 가려진 경우 등) 목표 값에는 반드시 도착하게 한다
    root._finish = setTimeout(() => setValues(root, target), ANIM_MS + 150);
  }

  /* 슬라이드에 들어올 때: 앞에서 왔으면 첫 단계, 뒤에서 왔으면 마지막 단계 */
  function enter(slide, fromBehind) {
    const root = stepRoot(slide);
    if (!root) return;
    const steps = defs[root.dataset.sim].steps;
    const i = fromBehind ? steps.length - 1 : 0;
    markStep(root, i);
    setValues(root, steps[i]);
  }

  /* 단계를 하나 넘긴다. 넘길 단계가 없으면 false (그때는 슬라이드를 넘긴다) */
  function step(slide, dir) {
    const root = stepRoot(slide);
    if (!root) return false;
    const steps = defs[root.dataset.sim].steps;
    const i = +root.dataset.step + dir;
    if (i < 0 || i >= steps.length) return false;
    markStep(root, i);
    animateTo(root, steps[i]);
    return true;
  }

  /* 슬라이더 연결 (슬라이드가 화면에 만들어진 뒤 한 번) */
  const wire = (stage) => stage.querySelectorAll('[data-sim]').forEach((root) => {
    root.querySelectorAll('input').forEach((inp) => inp.addEventListener('input', () => { stopAnim(root); render(root); }));
  });
  /* 보이는 슬라이드 안의 시뮬레이션만 그린다 (숨겨진 캔버스는 크기가 0) */
  const renderIn = (slide) => slide.querySelectorAll('[data-sim]').forEach(render);

  return { define, markup, wire, renderIn, enter, step };
})();
</script>

(() => {

  const trend = (ui, dz) => {

    else ui.status("겨우 유지");

  /* '세대별 숙련도' 그래프 */
  const levelChart = ({ gens, xTicks, runs, main, floor, ...rest }) => {
    const yMax = Chart.niceMax(Math.max(floor, ...runs.flat()));
    return {
      xMax: gens,
      yMax,
      xTicks,
      yTicks: [0, yMax / 2, yMax].map((v) => +v.toFixed(0)),
      xLabel: "세대",
      yLabel: "최고 숙련도",
      faint: runs,
      main,
      ...rest,
    };
  };

  /* ---------- 인구와 복잡도 ---------- */
  {

            label: "지금의 화성 탐사",
            title: "성능을 포기한 선례",
            text: "퍼서비어런스 로버는 2000년대 초 설계의 내방사선 칩(RAD750)을 쓴다. 다만 이 칩도 지구에서 만든다.",
          }),
        ]),
        small(
          "답에 필요한 근거: 오래된 공정 공장의 설비·인력 규모, 신뢰성 공학(고장률·수명), Collapse OS"
        ),
      ],
    },
    {
      sec: QUESTION,
      ref: "512쪽, Henrich (2004)",
      body: [
        questionLabel("질문 3"),
        question(
          `분업이 깊어질수록 기술 하나를 배우는 사람은 줄지만, 한 사람은 더 깊이 배운다. 작은 정착지에서 분업은 ${accent(
            "득일까 실일까?"
          )}`
        ),
        cols(2, [
          col({
            label: "실: N이 준다",
            title: "기술마다 배우는 사람이 적어진다",
            text: "헨릭 모델에서는 배우는 사람이 N* 아래로 줄면 따라 배우다 잃는 것을 메우지 못한다.",
          }),
          col({
            label: "득: α가 준다",
            title: "한 기술에 집중하면 덜 잃는다",
            text: "더 정확히 배워 잃는 정도가 줄어든다. 반도체처럼 깊은 분업이 있어야 가능한 기술도 있다 (512).",
          }),
        ]),
        small(
          "헨릭 모델에는 분업이 없다. 'α가 준다'는 발표자의 가설. 답에 필요한 근거: 분업의 깊이와 기술 유지의 관계를 다룬 연구, Hidalgo (2015) '퍼슨바이트'"
        ),
      ],
    },

    /* ===== 생각거리 (에세이를 쓰는 동안 띄워 둔다) ===== */
    {
      sec: ESSAY,
      ref: "505–512쪽",
      title: `발표 논리대로라면 1,000명으로는 실패한다.<br>그래도 보내야 한다면, ${accent(
        "무엇을 포기"
      )}하는 것이 나을까?`,
      body: [
        cols(3, [
          col({
            label: "512쪽",
            title: "지금 필요한 전문가",
            text: "의사, 엔지니어, 기술자. 반도체 같은 기술은 전문 인력이 많아야 유지된다.",
          }),
          col({
            label: "505–508쪽",
            title: "다음 세대를 이을 젊은 사람",
            text: "출산할 수 있는 나이의, 유전적으로 다양한 사람들. 유효 인구가 정착지의 수명을 정한다.",
          }),
          col({
            label: "Henrich (2004)",
            title: "잘 가르치는 사람",
            text: "교사와 숙련공. 배우는 사람이 줄면 복잡한 기술부터 사라진다.",
          }),
        ]),
        small(
          "그리고 1,000명에게 직업을 배정할 것인가, 스스로 고르게 할 것인가? 책은 결혼과 출산 통제를 자유를 이유로 거부했다 (509–510)"
        ),
      ],
    },
    {
      noFoot: true,

</script>
    <script>
/* 슬라이드 만들기, 이동, 화면 맞춤. 내용은 content/slides.js에 있다. */
(() => {
  const STAGE_W = 1600, STAGE_H = 900, MARGIN = 0.97;
  const stage = document.getElementById('stage');

  /* 고치다가 슬라이드 파일에 문법 오류가 나면 빈 화면 대신 알려 준다 */
  if (!window.SLIDES) {
    stage.classList.add('ready');
    stage.innerHTML = '<div class="load-error">슬라이드를 불러오지 못했습니다. content/slides.js 또는 content/sims.js의 문법 오류일 수 있습니다. (F12 → Console에서 줄 번호 확인)</div>';
    return;
  }

  /* ---------- 슬라이드 만들기 ---------- */
  const total = SLIDES.length;

  function slideHtml(s, i) {
    const left = [s.sec, s.ref].filter(Boolean).join('&emsp;');
    return `<section class="slide ${s.cls || ''}">
      ${s.title ? `<h2>${s.title}</h2>` : ''}
      ${[s.body].flat().join('')}
      ${s.noFoot ? '' : `<div class="foot"><span>${left}</span><span>${i + 1}</span></div>`}
    </section>`;
  }

  stage.innerHTML = SLIDES.map(slideHtml).join('');
  const slides = [...stage.querySelectorAll('.slide')];
  Sims.wire(stage);

  /* ---------- 이동 ---------- */
  let cur = -1;

  /* dir: -1이면 뒤에서 들어온 것. 시뮬레이션을 마지막 단계로 맞춘다 (js/sim-kit.js) */
  function show(i, dir = 0) {
    if (document.activeElement && document.activeElement.type === 'range') document.activeElement.blur();
    const prev = cur;
    cur = Math.max(0, Math.min(total - 1, i));
    slides.forEach((s, j) => s.classList.toggle('on', j === cur));
    if (cur !== prev) Sims.enter(slides[cur], dir < 0);
    document.getElementById('cnt').textContent = (cur + 1) + ' / ' + total;
    if (location.hash !== '#s' + (cur + 1)) history.replaceState(null, '', '#s' + (cur + 1));
    redraw();
  }
  const redraw = () => Sims.renderIn(slides[cur]);

  /* 다음/이전: 시뮬레이션 단계가 남아 있으면 단계부터 넘긴다 */
  const go = (dir) => { if (!Sims.step(slides[cur], dir)) show(cur + dir, dir); };

  function fromHash() {
    const m = /^#s(\d+)$/.exec(location.hash);
    return m ? parseInt(m[1], 10) - 1 : 0;
  }

  function fit() {
    const k = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H) * MARGIN;
    stage.style.transform = `translate(-50%, -50%) scale(${k})`;
  }

  function toggleFullscreen() {
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    if (p && p.catch) p.catch(() => {});
  }

  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(1));
  document.getElementById('fs').addEventListener('click', toggleFullscreen);

  document.addEventListener('keydown', (e) => {
    const onSlider = e.target && e.target.type === 'range';
    const onButton = e.target && e.target.tagName === 'BUTTON';
    // 슬라이더에서 ←→는 값 조절, 버튼에서 스페이스는 버튼 누르기. 발표 리모컨의 PageUp/Down은 항상 넘긴다.
    if (onSlider && e.key.startsWith('Arrow')) return;
    if (onButton && e.key === ' ') return;
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(total - 1);
  });

  /* 터치패드 두 손가락 쓸기(휠 이벤트). 손을 뗀 뒤에도 관성으로 이벤트가 이어지므로,
     한 번 넘긴 뒤에는 이벤트가 잠시 멈출 때까지 더 넘기지 않는다. */
  const WHEEL_THRESHOLD = 40, WHEEL_QUIET_MS = 200;
  let wheelSum = 0, wheelLocked = false, wheelTimer;
  window.addEventListener('wheel', (e) => {
    if (e.ctrlKey) return; // 핀치 확대는 건드리지 않는다
    e.preventDefault(); // 브라우저의 뒤로 가기 제스처를 막는다
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { wheelLocked = false; wheelSum = 0; }, WHEEL_QUIET_MS);
    if (wheelLocked) return;
    wheelSum += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(wheelSum) >= WHEEL_THRESHOLD) {
      go(wheelSum > 0 ? 1 : -1);
      wheelLocked = true;
    }
  }, { passive: false });

  /* 화면 터치나 마우스로 끌어서 넘기기. 슬라이더와 버튼 위에서는 동작하지 않는다. */
  const SWIPE_MIN_PX = 60;
  let swipe = null;
  window.addEventListener('pointerdown', (e) => {
    swipe = e.target.closest('input, button') ? null : { id: e.pointerId, x: e.clientX, y: e.clientY };
  });
  window.addEventListener('pointerup', (e) => {
    if (!swipe || swipe.id !== e.pointerId) return;
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.abs(dx) >= SWIPE_MIN_PX && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });
  window.addEventListener('pointercancel', () => { swipe = null; });

  window.addEventListener('hashchange', () => show(fromHash()));
  window.addEventListener('resize', fit);

  /* 글꼴이 바뀌면서 글자가 움직이지 않도록, 전체 슬라이드에 쓰는 글자를 받은 뒤에 화면을 보여 준다.
     인터넷이 없거나 느리면 FONT_WAIT_MS 뒤에 시스템 글꼴로라도 보여 준다. */
  const FONT_WAIT_MS = 2000;
  const fontFamily = getComputedStyle(document.body).fontFamily;
  const fontsLoaded = Promise.all(
    ['400', '600'].map((weight) => document.fonts.load(`${weight} 30px ${fontFamily}`, stage.textContent))
  ).catch(() => {});
  const timeout = new Promise((resolve) => setTimeout(resolve, FONT_WAIT_MS));
  Promise.race([fontsLoaded, timeout]).then(() => {
    stage.classList.add('ready');
    redraw(); // 차트 글자도 받은 글꼴로 다시 그린다
  });
  fontsLoaded.then(redraw); // 시간 초과 뒤에 글꼴이 도착한 경우

  fit();
  show(fromHash());
})();
</script>
